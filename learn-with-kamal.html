<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Learn With Kamal | Computer Learning Academy</title>

<style>
:root{
 --bg:#06101d;
 --panel:#0c1b2d;
 --panel2:#11263e;
 --text:#f3f8ff;
 --muted:#9fb2c8;
 --blue:#4d8dff;
 --cyan:#00d9ff;
 --green:#20d477;
 --red:#ff4d5e;
 --yellow:#ffc14d;
 --border:#223b58;
 --shadow:0 18px 50px rgba(0,0,0,.3);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
 margin:0;
 background:
 radial-gradient(circle at 80% 0%,rgba(0,217,255,.07),transparent 30%),
 linear-gradient(135deg,#040b14,#081525,#06101d);
 color:var(--text);
 font-family:Segoe UI,Arial,sans-serif;
 min-height:100vh;
}

button,input,textarea,select{font:inherit}

button{cursor:pointer}

.app{
 display:flex;
 min-height:100vh;
}

/* SIDEBAR */

.sidebar{
 width:270px;
 position:fixed;
 top:0;
 bottom:0;
 left:0;
 padding:20px 14px;
 background:rgba(6,16,29,.97);
 border-right:1px solid var(--border);
 overflow-y:auto;
 z-index:100;
 transition:.3s;
}

.brand{
 display:flex;
 align-items:center;
 gap:12px;
 padding:8px 9px 25px;
}

.brand-logo{
 width:48px;
 height:48px;
 display:grid;
 place-items:center;
 border-radius:14px;
 background:linear-gradient(135deg,var(--blue),var(--cyan));
 box-shadow:0 8px 25px rgba(0,190,255,.25);
 font-size:25px;
}

.brand h1{
 margin:0;
 font-size:18px;
}

.brand small{
 color:var(--muted);
}

.nav-title{
 color:#66809a;
 font-size:10px;
 letter-spacing:1.5px;
 text-transform:uppercase;
 padding:15px 12px 7px;
}

.nav button{
 width:100%;
 border:0;
 background:transparent;
 color:#b6c8db;
 text-align:left;
 padding:12px;
 border-radius:10px;
 margin:2px 0;
 transition:.2s;
}

.nav button:hover,
.nav button.active{
 background:linear-gradient(
  90deg,
  rgba(77,141,255,.2),
  rgba(0,217,255,.04)
 );
 color:white;
}

.nav button.active{
 border-left:3px solid var(--cyan);
}

/* MAIN */

.main{
 margin-left:270px;
 width:calc(100% - 270px);
}

.topbar{
 height:68px;
 position:sticky;
 top:0;
 z-index:50;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
 padding:12px 25px;
 background:rgba(5,14,25,.85);
 backdrop-filter:blur(18px);
 border-bottom:1px solid var(--border);
}

.search{
 width:min(520px,65%);
}

.search input{
 width:100%;
 padding:12px 15px;
 border-radius:10px;
 border:1px solid var(--border);
 background:#0b192b;
 color:white;
 outline:none;
}

.actions{
 display:flex;
 gap:8px;
}

.icon-btn{
 width:42px;
 height:42px;
 border-radius:10px;
 border:1px solid var(--border);
 background:#10253d;
 color:white;
}

.mobile-menu{display:none}

.content{
 max-width:1500px;
 padding:30px;
 margin:auto;
}

/* HERO */

.hero{
 padding:40px;
 border:1px solid var(--border);
 border-radius:25px;
 background:
 radial-gradient(circle at 85% 20%,rgba(0,217,255,.17),transparent 32%),
 radial-gradient(circle at 20% 100%,rgba(77,141,255,.12),transparent 35%),
 #0b1b2e;
 box-shadow:var(--shadow);
}

.hero-badge{
 display:inline-block;
 padding:6px 11px;
 border-radius:20px;
 background:#102e4d;
 color:#76caff;
 font-size:11px;
 font-weight:bold;
}

.hero h2{
 font-size:clamp(30px,5vw,56px);
 margin:18px 0 12px;
 line-height:1.05;
}

.gradient{
 background:linear-gradient(90deg,#70a7ff,#00e5ff);
 -webkit-background-clip:text;
 color:transparent;
}

.hero p{
 color:var(--muted);
 max-width:800px;
 line-height:1.8;
}

.btn{
 border:0;
 border-radius:10px;
 padding:12px 18px;
 color:white;
 background:linear-gradient(135deg,var(--blue),#276be9);
 font-weight:700;
 margin:5px 4px 5px 0;
 transition:.2s;
}

.btn:hover{
 transform:translateY(-2px);
 box-shadow:0 8px 20px rgba(77,141,255,.2);
}

.btn.secondary{
 background:#122942;
 border:1px solid var(--border);
}

.btn.green{background:var(--green)}
.btn.red{background:var(--red)}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px;
 margin:22px 0;
}

.stat{
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:16px;
 padding:20px;
}

.stat strong{
 display:block;
 font-size:28px;
 margin-bottom:5px;
}

.stat span{
 color:var(--muted);
 font-size:13px;
}

/* SECTION */

.section-head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin:30px 0 16px;
}

.section-head h2{margin:0}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:18px;
}

.card{
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:17px;
 padding:20px;
 transition:.25s;
}

.card:hover{
 transform:translateY(-4px);
 border-color:#315b83;
 box-shadow:var(--shadow);
}

.card-icon{
 font-size:34px;
 margin-bottom:12px;
}

.card h3{
 margin:8px 0;
}

.card p{
 color:var(--muted);
 line-height:1.65;
 font-size:14px;
}

.badge{
 display:inline-block;
 padding:5px 9px;
 border-radius:20px;
 background:#112d49;
 color:#7ecaff;
 font-size:10px;
 font-weight:bold;
}

/* PROGRESS */

.progress{
 height:7px;
 border-radius:20px;
 overflow:hidden;
 background:#182c43;
 margin:15px 0;
}

.progress div{
 height:100%;
 background:linear-gradient(90deg,var(--blue),var(--cyan));
 transition:.5s;
}

/* LESSON */

.lesson{
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:20px;
 padding:30px;
}

.lesson h2{
 font-size:34px;
}

.lesson h3{
 color:#6dbbff;
 margin-top:28px;
}

.lesson p,
.lesson li{
 color:#c2cfdd;
 line-height:1.85;
}

.lesson li{
 margin:7px 0;
}

.code{
 background:#020811;
 color:#8de2ff;
 padding:18px;
 border-radius:12px;
 border:1px solid #1c344e;
 overflow:auto;
 font-family:Consolas,monospace;
 line-height:1.7;
}

/* QUIZ */

.quiz-box{
 max-width:950px;
 margin:auto;
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:20px;
 padding:28px;
}

.quiz-top{
 display:flex;
 justify-content:space-between;
 color:var(--muted);
}

.question{
 font-size:23px;
 line-height:1.5;
 margin:25px 0;
}

.option{
 display:block;
 width:100%;
 text-align:left;
 padding:16px;
 margin:9px 0;
 border-radius:12px;
 border:1px solid #29435f;
 background:#10243a;
 color:white;
 transition:.2s;
}

.option:hover{
 border-color:var(--blue);
}

.option.correct{
 background:rgba(32,212,119,.15);
 border-color:var(--green);
}

.option.wrong{
 background:rgba(255,77,94,.15);
 border-color:var(--red);
}

.explanation{
 margin-top:18px;
 padding:15px;
 border-radius:10px;
 border-left:4px solid var(--cyan);
 background:#091728;
 color:#bdccdb;
 line-height:1.6;
}

/* TYPING */

.typing{
 max-width:1100px;
 margin:auto;
}

.typing-stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
 margin:20px 0;
}

.type-stat{
 text-align:center;
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:13px;
 padding:16px;
}

.type-stat strong{
 display:block;
 font-size:27px;
}

.type-display{
 min-height:190px;
 background:#030912;
 border:1px solid var(--border);
 border-radius:16px;
 padding:25px;
 color:#71859b;
 font-size:21px;
 line-height:2;
 margin-bottom:15px;
}

.type-display .typed{
 color:white;
}

.type-display .wrong{
 color:#ff6371;
 background:rgba(255,77,94,.12);
}

.type-display .current{
 color:white;
 background:#235f9a;
 border-radius:3px;
}

#typingInput{
 width:100%;
 min-height:150px;
 resize:vertical;
 padding:18px;
 color:white;
 background:#0b1b2e;
 border:1px solid var(--border);
 border-radius:14px;
 outline:none;
 line-height:1.6;
}

.controls{
 margin:15px 0;
 display:flex;
 flex-wrap:wrap;
 gap:5px;
}

/* TABLE */

.table-wrap{
 overflow:auto;
}

table{
 width:100%;
 border-collapse:collapse;
 background:var(--panel);
 border-radius:15px;
 overflow:hidden;
}

th,td{
 padding:14px;
 border-bottom:1px solid var(--border);
 text-align:left;
}

th{color:#76c8ff}
td{color:#c5d3e0}

/* LIGHT MODE */

body.light{
 background:#edf4fb;
 color:#102033;
}

body.light .sidebar,
body.light .topbar{
 background:rgba(246,250,255,.96);
}

body.light .card,
body.light .stat,
body.light .lesson,
body.light .quiz-box,
body.light .type-stat{
 background:white;
}

body.light .hero{
 background:white;
}

body.light .search input{
 background:white;
 color:#102033;
}

body.light .card p,
body.light .lesson p,
body.light .lesson li,
body.light td{
 color:#4e6073;
}

/* MOBILE */

@media(max-width:1000px){
 .grid{grid-template-columns:repeat(2,1fr)}
 .stats{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:700px){

 .sidebar{
  transform:translateX(-100%);
 }

 .sidebar.open{
  transform:translateX(0);
 }

 .main{
  margin-left:0;
  width:100%;
 }

 .mobile-menu{
  display:block;
 }

 .topbar{
  padding:10px;
 }

 .search{
  width:55%;
 }

 .content{
  padding:15px;
 }

 .hero{
  padding:25px;
 }

 .grid{
  grid-template-columns:1fr;
 }

 .stats{
  grid-template-columns:1fr 1fr;
 }

 .typing-stats{
  grid-template-columns:1fr 1fr;
 }

 .lesson{
  padding:20px;
 }

 .question{
  font-size:19px;
 }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

 <div class="brand">
  <div class="brand-logo">🎓</div>
  <div>
   <h1>Learn With Kamal</h1>

  </div>
 </div>

 <div class="nav">

  <div class="nav-title">Main</div>

  <button onclick="showPage('lessons',this)">

  </button>

  <button onclick="openLesson('programming')">👨‍💻 Programming</button>

 </div>

<header class="topbar">

 <button class="icon-btn mobile-menu" onclick="toggleSidebar()">☰</button>

</main>

</div>

<script>

/* =========================================================
   LANGUAGE
========================================================= */

const lang={
 en:{
  welcome:"Master Computers. Build Your Future.",
  subtitle:"Learn computer basics, advanced technology, programming, networking, cybersecurity, databases, AI and more.",
  start:"Start Learning"
 },
 hi:{
  welcome:"कंप्यूटर सीखें और अपना भविष्य बनाएं।",
  subtitle:"कंप्यूटर बेसिक्स से लेकर एडवांस टेक्नोलॉजी, प्रोग्रामिंग, नेटवर्किंग, साइबर सिक्योरिटी और AI तक सीखें।",
  start:"सीखना शुरू करें"
 },
 pa:{
  welcome:"ਕੰਪਿਊਟਰ ਸਿੱਖੋ ਅਤੇ ਆਪਣਾ ਭਵਿੱਖ ਬਣਾਓ।",
  subtitle:"ਕੰਪਿਊਟਰ ਬੇਸਿਕ ਤੋਂ ਐਡਵਾਂਸ ਟੈਕਨੋਲੋਜੀ, ਪ੍ਰੋਗਰਾਮਿੰਗ, ਨੈੱਟਵਰਕਿੰਗ, ਸਾਈਬਰ ਸਿਕਿਉਰਿਟੀ ਅਤੇ AI ਤੱਕ ਸਿੱਖੋ।",
  start:"ਸਿੱਖਣਾ ਸ਼ੁਰੂ ਕਰੋ"
 }
};

let language=localStorage.getItem("kamalLanguage")||"en";

/* =========================================================
   PROGRESS
========================================================= */

let completed=JSON.parse(
 localStorage.getItem("kamalCompleted")||"[]"
);

let totalCorrect=Number(
 localStorage.getItem("kamalCorrect")||0
);

let totalAnswered=Number(
 localStorage.getItem("kamalAnswered")||0
);

/* =========================================================
   LESSONS
========================================================= */

const lessons=[

{
 id:"basics",
 icon:"🖥️",
 title:"Computer Fundamentals",
 level:"BEGINNER",
 html:`
 <h2>Computer Fundamentals</h2>

 <p>
 A computer is an electronic programmable machine that accepts
 input, processes information, stores data and produces output.
 </p>

 <h3>Four Main Operations</h3>

 <ul>
  <li><b>Input:</b> keyboard, mouse, microphone, scanner.</li>
  <li><b>Processing:</b> CPU executes instructions.</li>
  <li><b>Storage:</b> RAM, SSD, HDD and other storage.</li>
  <li><b>Output:</b> monitor, printer, speakers.</li>
 </ul>

 <h3>Binary System</h3>

 <p>
 Digital computers represent information using bits. A bit has
 two possible states: 0 and 1. Eight bits make one byte.
 </p>

 <h3>Important Units</h3>

 <ul>
  <li>1 Byte = 8 bits</li>
  <li>1 KB ≈ 1,000 bytes</li>
  <li>1 MB ≈ 1,000 KB</li>
  <li>1 GB ≈ 1,000 MB</li>
  <li>1 TB ≈ 1,000 GB</li>
 </ul>

 <h3>Computer Generations</h3>

 <p>
 Early computers used vacuum tubes. Later generations used
 transistors, integrated circuits, microprocessors and modern
 highly integrated computing systems.
 </p>
 `
},

{
 id:"hardware",
 icon:"⚙️",
 title:"Hardware & CPU Architecture",
 level:"INTERMEDIATE",
 html:`
 <h2>Hardware & CPU Architecture</h2>

 <p>
 Hardware refers to the physical components of a computer.
 </p>

 <h3>CPU</h3>

 <p>
 The CPU executes instructions. Important concepts include
 registers, cache, cores, threads, pipelines and branch prediction.
 </p>

 <h3>CPU Cache</h3>

 <p>
 Cache memory is much smaller and faster than main memory and
 helps reduce the time required to access frequently needed data.
 </p>

 <h3>RAM</h3>

 <p>
 RAM is volatile working memory used by active programs and
 operating-system processes.
 </p>

 <h3>Storage</h3>

 <ul>
  <li>HDD — magnetic storage with moving parts.</li>
  <li>SSD — flash-based storage without spinning platters.</li>
  <li>NVMe SSD — high-speed SSD using PCIe.</li>
 </ul>

 <h3>Motherboard</h3>

 <p>
 The motherboard connects the CPU, memory, storage, expansion
 devices and peripheral interfaces.
 </p>
 `
},

{
 id:"software",
 icon:"💾",
 title:"Operating Systems & Software",
 level:"INTERMEDIATE",
 html:`
 <h2>Operating Systems</h2>

 <p>
 An operating system manages hardware resources and provides
 services that applications use.
 </p>

 <h3>Main Responsibilities</h3>

 <ul>
  <li>Process management</li>
  <li>Memory management</li>
  <li>File systems</li>
  <li>Device management</li>
  <li>User permissions</li>
  <li>Networking</li>
  <li>Security</li>
 </ul>

 <h3>Processes and Threads</h3>

 <p>
 A process represents a running program and its resources.
 Threads are execution units within processes and can share
 process resources.
 </p>

 <h3>Virtual Memory</h3>

 <p>
 Virtual memory allows operating systems to provide an address
 space larger than physical RAM by using storage as backing
 memory for some pages.
 </p>
 `
},

{
 id:"network",
 icon:"🌐",
 title:"Computer Networking",
 level:"ADVANCED",
 html:`
 <h2>Computer Networking</h2>

 <p>
 Networking allows computers and devices to exchange information.
 </p>

 <h3>OSI Model</h3>

 <ol>
  <li>Physical</li>
  <li>Data Link</li>
  <li>Network</li>
  <li>Transport</li>
  <li>Session</li>
  <li>Presentation</li>
  <li>Application</li>
 </ol>

 <h3>TCP and UDP</h3>

 <p>
 TCP provides connection-oriented reliable ordered delivery.
 UDP is connectionless and has less protocol overhead.
 </p>

 <h3>Important Topics</h3>

 <ul>
  <li>IP addressing</li>
  <li>Subnetting</li>
  <li>DNS</li>
  <li>DHCP</li>
  <li>NAT</li>
  <li>Routing</li>
  <li>Switching</li>
  <li>HTTP and HTTPS</li>
 </ul>

 <h3>Example</h3>

 <div class="code">
Client → Switch → Router → Internet → Server
 </div>
 `
},

{
 id:"security",
 icon:"🔐",
 title:"Cybersecurity",
 level:"ADVANCED",
 html:`
 <h2>Cybersecurity</h2>

 <p>
 Cybersecurity protects systems, networks and information
 against unauthorized access, modification and disruption.
 </p>

 <h3>CIA Triad</h3>

 <ul>
  <li><b>Confidentiality</b> — prevent unauthorized disclosure.</li>
  <li><b>Integrity</b> — prevent unauthorized modification.</li>
  <li><b>Availability</b> — keep systems accessible.</li>
 </ul>

 <h3>Authentication vs Authorization</h3>

 <p>
 Authentication determines who a user is.
 Authorization determines what that user is allowed to access.
 </p>

 <h3>Security Principles</h3>

 <ul>
  <li>Least privilege</li>
  <li>Defense in depth</li>
  <li>Strong authentication</li>
  <li>Encryption</li>
  <li>Secure backups</li>
  <li>Patch management</li>
 </ul>
 `
},

{
 id:"programming",
 icon:"👨‍💻",
 title:"Programming & Algorithms",
 level:"ADVANCED",
 html:`
 <h2>Programming & Algorithms</h2>

 <p>
 Programming is the process of creating instructions that a
 computer can execute.
 </p>

 <h3>Programming Fundamentals</h3>

 <ul>
  <li>Variables</li>
  <li>Data types</li>
  <li>Functions</li>
  <li>Loops</li>
  <li>Conditions</li>
  <li>Objects</li>
  <li>Classes</li>
  <li>Exceptions</li>
 </ul>

 <h3>Big-O Complexity</h3>

 <div class="code">
O(1)       Constant
O(log n)   Logarithmic
O(n)       Linear
O(n log n) Linearithmic
O(n²)      Quadratic
O(2ⁿ)      Exponential
 </div>

 <h3>Data Structures</h3>

 <p>
 Important data structures include arrays, linked lists,
 stacks, queues, hash tables, trees and graphs.
 </p>
 `
},

{
 id:"database",
 icon:"🗄️",
 title:"Databases & SQL",
 level:"ADVANCED",
 html:`
 <h2>Databases & SQL</h2>

 <p>
 Databases organize and manage information so it can be
 efficiently stored, searched and updated.
 </p>

 <h3>Relational Database</h3>

 <p>
 Relational databases organize data into tables and use keys
 to establish relationships.
 </p>

 <h3>SQL Example</h3>

 <div class="code">
SELECT name, marks
FROM students
WHERE marks &gt;= 80
ORDER BY marks DESC;
 </div>

 <h3>Important Concepts</h3>

 <ul>
  <li>Primary keys</li>
  <li>Foreign keys</li>
  <li>Indexes</li>
  <li>Transactions</li>
  <li>ACID</li>
  <li>Normalization</li>
  <li>Joins</li>
 </ul>
 `
},

{
 id:"cloud",
 icon:"☁️",
 title:"Cloud Computing & Artificial Intelligence",
 level:"ADVANCED",
 html:`
 <h2>Cloud Computing & AI</h2>

 <h3>Cloud Computing</h3>

 <p>
 Cloud computing provides computing resources over a network,
 often with on-demand provisioning.
 </p>

 <h3>Cloud Service Models</h3>

 <ul>
  <li><b>IaaS</b> — Infrastructure as a Service</li>
  <li><b>PaaS</b> — Platform as a Service</li>
  <li><b>SaaS</b> — Software as a Service</li>
 </ul>

 <h3>Artificial Intelligence</h3>

 <p>
 AI systems can perform tasks such as classification,
 prediction, generation, recognition and decision support.

let qIndex=0;
let qScore=0;
let qLocked=false;

function quizPage(){

 qIndex=0;
 qScore=0;
 qLocked=false;

 renderQuestion();
}

function renderQuestion(){

 if(qIndex>=quiz.length){

  finishQuiz();
  return;
 }

 const q=quiz[qIndex];

 document.getElementById("content").innerHTML=`

 <div class="quiz-box">

  <div class="quiz-top">

   <span>
    🧠 HARD QUIZ
    ${qIndex+1} / ${quiz.length}
   </span>

   <span>
    Score: ${qScore}
   </span>

  </div>

  <div class="progress">
   <div style="width:${qIndex/quiz.length*100}%"></div>
  </div>

  <div class="question">
   ${q[0]}
  </div>

  <div id="answers">

   ${q[1].map((answer,i)=>`

    <button
     class="option"
     onclick="answerQuestion(${i})">

     ${String.fromCharCode(65+i)}.
     ${answer}

    </button>

   `).join("")}

  </div>

  <div id="explanation"></div>

  <div style="margin-top:20px">

   <button
    class="btn secondary"
    onclick="showPage('dashboard')">

    Exit Quiz

   </button>

   <button
    class="btn"
    id="nextBtn"
    style="display:none"
    onclick="nextQuestion()">

    Next Question →

   </button>

  </div>

 </div>

 `;
}

function answerQuestion(selected){

 if(qLocked)return;

 qLocked=true;

 const q=quiz[qIndex];

 const options=document.querySelectorAll(".option");

 options.forEach((button,i)=>{

  if(i===q[2]){
   button.classList.add("correct");
  }

  if(i===selected && i!==q[2]){
   button.classList.add("wrong");
  }

 });

 totalAnswered++;

 if(selected===q[2]){
  qScore++;
  totalCorrect++;
 }

 localStorage.setItem(
  "kamalCorrect",
  totalCorrect
 );

 localStorage.setItem(
  "kamalAnswered",
  totalAnswered
 );

 document.getElementById("explanation").innerHTML=`

 <div class="explanation">

  <b>Explanation:</b>
  ${q[3]}

 </div>

 `;

 document.getElementById("nextBtn").style.display="inline-block";
}

function nextQuestion(){

 qIndex++;
 qLocked=false;

 renderQuestion();
}

function finishQuiz(){

 const percentage=Math.round(
  qScore/quiz.length*100
 );

 document.getElementById("content").innerHTML=`

 <div class="quiz-box" style="text-align:center">

  <div style="font-size:70px">🏆</div>

  <h2>Quiz Completed!</h2>

  <p>
   You completed all ${quiz.length} hard-level questions.

  <div class="stats">

   <div class="stat">
    <strong>${qScore}/${quiz.length}</strong>
    <span>Score</span>
   </div>

   <div class="stat">
    <strong>${percentage}%</strong>
    <span>Accuracy</span>
   </div>

  </div>

  <h3>
   ${
    percentage>=90
    ?"🔥 Outstanding! Advanced computer knowledge."
    :percentage>=75
    ?"⭐ Excellent! Keep practicing."
    :percentage>=50
    ?"👍 Good work. Review the advanced lessons."
    :"📚 Keep learning and try the quiz again."
   }
  </h3>

  <button
   class="btn"
   onclick="quizPage()">

  </button>

 </div>

 `;
}

    <button
     class="btn"
     onclick="startTyping()">

     ▶ Start / Restart

    </button>

    <button
     class="btn secondary"
     onclick="typingDifficulty(-1)">

     ← Easier

    </button>

    <button
     class="btn secondary"
     onclick="typingDifficulty(1)">

     Harder →

    </button>

   </div>

   <p style="color:var(--muted)">
    Hard mode target: <b>50+ WPM</b> and
    <b>95%+ accuracy</b>.
    Higher levels use longer technical passages.
   </p>

  </div>

 </div>

 `;

 renderTyping();
}

function renderTyping(){

 const display=document.getElementById("typeDisplay");

 if(!display)return;

 display.innerHTML=typingText
 .split("")
 .map((c,i)=>
  `<span id="char${i}">
   ${c===" "?"&nbsp;":escapeHTML(c)}
  </span>`
 )
 .join("");

 const input=document.getElementById("typingInput");

 if(input){
  input.value="";
  input.disabled=false;
 }
}

function startTyping(){

 clearInterval(typingInterval);

 if(typingLevel>=3){
  typingText=
   typingPassages.slice(0,3).join(" ");
 }

 if(typingLevel>=5){
  typingText=
   typingPassages.join(" ");
 }

 renderTyping();

 typingStart=Date.now();

 const input=document.getElementById("typingInput");

 input.focus();

 typingInterval=setInterval(()=>{

  const elapsed=
   Math.floor((Date.now()-typingStart)/1000);

  const remaining=
   Math.max(0,60-elapsed);

  const time=document.getElementById("time");

  if(time)time.textContent=remaining;

  if(remaining<=0){

   clearInterval(typingInterval);

   input.disabled=true;

   alert("⏱ Time finished! Try again to improve your typing speed.");
  }

 },250);
}

function typingUpdate(){

 if(!typingStart){
  startTyping();
 }

 const input=document.getElementById("typingInput");

 const value=input.value;

 let correct=0;

 for(let i=0;i<value.length;i++){

  const char=
   document.getElementById("char"+i);

  if(value[i]===typingText[i]){
   correct++;

   if(char)char.className="typed";

  }else{

   if(char)char.className="wrong";
  }
 }

 const elapsed=
  Math.max((Date.now()-typingStart)/1000,1);

 const words=correct/5;

 const wpm=
  Math.round(words/(elapsed/60));

 const accuracy=
  value.length
  ?Math.round(correct/value.length*100)
  :100;

 document.getElementById("wpm").textContent=
  Math.max(0,wpm);

 document.getElementById("accuracy").textContent=
  accuracy+"%";

 document.getElementById("chars").textContent=
  value.length;

 if(value.length>=typingText.length){

  clearInterval(typingInterval);

  input.disabled=true;

  if(accuracy>=95){

   alert(
    "🎉 Level Complete!\n"+
    "WPM: "+wpm+
    "\nAccuracy: "+accuracy+"%"
   );

   if(typingLevel<5){
    typingLevel++;
   }

  }else{

   alert(
    "Passage complete.\n"+
    "Accuracy: "+accuracy+"%\n"+
    "Try again and reach 95%+."
   );

  }

 }
}

function typingDifficulty(change){

 typingLevel=
  Math.max(1,Math.min(5,typingLevel+change));

 if(typingLevel===1){
  typingText=typingPassages[0];
 }

 if(typingLevel===2){
  typingText=typingPassages[
   Math.floor(Math.random()*typingPassages.length)
  ];
 }

 if(typingLevel===3){
  typingText=typingPassages.slice(0,3).join(" ");
 }

 if(typingLevel===4){
  typingText=typingPassages.slice(2,6).join(" ");
 }

 if(typingLevel===5){
  typingText=typingPassages.join(" ");
 }

 renderTyping();

 document.querySelector(".badge").textContent=
  "HARD • LEVEL "+typingLevel;
}

/* =========================================================
   PROGRESS
========================================================= */

function progressPage(){

 const coursePercent=
  Math.round(
   completed.length/lessons.length*100
  );

 const quizPercent=
  totalAnswered
  ?Math.round(totalCorrect/totalAnswered*100)
  :0;

 document.getElementById("content").innerHTML=`

 <div class="section-head">
  <h2>📊 My Progress</h2>
 </div>

 <div class="stats">

  <div class="stat">
   <strong>
    ${completed.length}/${lessons.length}
   </strong>
   <span>Courses Completed</span>
  </div>

  <div class="stat">
   <strong>${coursePercent}%</strong>
   <span>Course Progress</span>
  </div>

  <div class="stat">
   <strong>${totalAnswered}</strong>
   <span>Questions Attempted</span>
  </div>

  <div class="stat">
   <strong>${quizPercent}%</strong>
   <span>Quiz Accuracy</span>
  </div>

 </div>

 <div class="card">

  <h3>Course Completion</h3>

  <div class="progress">
   <div style="width:${coursePercent}%"></div>
  </div>

  <p>
   You have completed ${completed.length}
   of ${lessons.length} major courses.
  </p>

 </div>

 <div class="section-head">
  <h2>Course Status</h2>
 </div>

 <div class="grid">

 ${lessons.map(l=>`

  <div class="card">

   <div class="card-icon">${l.icon}</div>

   <h3>${l.title}</h3>

   <p>
    ${completed.includes(l.id)
     ?"✅ Completed"
     :"⭕ Not completed"}
   </p>

   <button
    class="btn secondary"
    onclick="openLesson('${l.id}')">

    Open Course

   </button>

  </div>

 `).join("")}

 </div>

 `;
}

/* =========================================================
   SEARCH
========================================================= */

function searchLessons(){

 const query=
  document.getElementById("search")
  .value.toLowerCase()
  .trim();

 if(!query){

  if(window.currentPage!=="quiz"){
   document.getElementById("content").innerHTML=
    dashboard();
  }

  return;
 }

 const results=
  lessons.filter(l=>
   l.title.toLowerCase().includes(query) ||
   l.level.toLowerCase().includes(query) ||
   l.html.toLowerCase().includes(query)
  );

 document.getElementById("content").innerHTML=`

 <div class="section-head">
  <h2>🔎 Search Results</h2>
  <span class="badge">${results.length} RESULTS</span>
 </div>

 <div class="grid">

 ${
 results.length
 ?results.map(l=>`

  <div class="card">

   <div class="card-icon">${l.icon}</div>

   <h3>${l.title}</h3>

   <span class="badge">${l.level}</span>

   <p>
    Computer learning course related to
    "${query}".
   </p>

   <button
    class="btn"
    onclick="openLesson('${l.id}')">

    Open Lesson

   </button>

  </div>

 `).join("")
 :
 `
 <div class="card">
  <h3>No Results Found</h3>
  <p>
   Try searching for CPU, RAM, networking,
   cybersecurity, programming, SQL, AI, etc.
  </p>
 </div>
 `
 }

 </div>

 `;
}

/* =========================================================
   ROUTING
========================================================= */

let currentPage="dashboard";

function showPage(page,button){

 currentPage=page;

 document.querySelectorAll(".nav button")
 .forEach(b=>b.classList.remove("active"));

 if(button){
  button.classList.add("active");
 }

 if(page==="dashboard"){

  document.getElementById("content").innerHTML=
   dashboard();

 }

 else if(page==="lessons"){

  lessonsPage();

 }

 else if(page==="quiz"){

  quizPage();

 }

 else if(page==="typing"){

  typingPage();

 }

 else if(page==="progress"){

  progressPage();

 }

 window.scrollTo(0,0);
}

/* =========================================================
   LANGUAGE
========================================================= */

function changeLanguage(){

 const choice=prompt(
 `Choose Language:

 1 = English
 2 = हिन्दी
 3 = ਪੰਜਾਬੀ`,
 "1"
 );

 if(choice==="1")language="en";
 else if(choice==="2")language="hi";
 else if(choice==="3")language="pa";
 else return;

 localStorage.setItem(
  "kamalLanguage",
  language
 );

 alert(
  language==="en"
  ?"Language changed to English"
  :language==="hi"
  ?"भाषा हिन्दी में बदल दी गई है"
  :"ਭਾਸ਼ਾ ਪੰਜਾਬੀ ਵਿੱਚ ਬਦਲ ਦਿੱਤੀ ਗਈ ਹੈ"
 );

 showPage("dashboard");
}

/* =========================================================
   THEME
========================================================= */

function toggleTheme(){

 document.body.classList.toggle("light");

 localStorage.setItem(
  "kamalTheme",
  document.body.classList.contains("light")
  ?"light"
  :"dark"
 );
}

/* =========================================================
   MOBILE
========================================================= */

function toggleSidebar(){

 document
  .getElementById("sidebar")
  .classList.toggle("open");
}

/* =========================================================
   RESET
========================================================= */

function resetProgress(){

 const yes=confirm(
  "Are you sure you want to reset all Learn With Kamal progress?"
 );

 if(!yes)return;

 completed=[];
 totalCorrect=0;
 totalAnswered=0;

 localStorage.removeItem("kamalCompleted");
 localStorage.removeItem("kamalCorrect");
 localStorage.removeItem("kamalAnswered");

 alert("Progress has been reset.");

 showPage("dashboard");
}

/* =========================================================
   UTILITIES
========================================================= */

function escapeHTML(text){

 return text
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");
}

/* =========================================================
   START
========================================================= */

if(localStorage.getItem("kamalTheme")==="light"){
 document.body.classList.add("light");
}

showPage("dashboard");

</script>
